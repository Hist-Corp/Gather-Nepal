<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Details — Gather Nepal</title>
  <meta name="description" content="View event details, check ticket availability, and book your spot at events across Nepal." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,300..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <nav class="navbar" id="navbar" aria-label="Main navigation">
    <div class="container">
      <a href="/" class="brand">Gather<em> Nepal</em></a>
      <div class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/events.html">Browse Events</a>
        <a href="/dashboard.html" id="dashboard-nav-link" style="display:none;">My Tickets</a>
        <a href="/create-event.html" id="create-nav-link" style="display:none;">Host Event</a>
        <a href="/signup.html" class="btn btn-ghost" id="signup-nav-btn">Sign Up</a>
        <a href="/login.html" class="btn btn-primary nav-cta" id="login-nav-btn">Log In</a>
        <span id="user-name-display" style="color:var(--amber); font-weight:600; font-size:0.88rem; font-family:var(--font-display);"></span>
        <button id="logout-btn" class="btn btn-ghost" style="display:none;">Log Out</button>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Breadcrumb -->
  <div style="padding:86px 0 0; background:var(--bg-1);">
    <div class="container" style="padding-top:var(--lg); padding-bottom:var(--lg);">
      <nav aria-label="Breadcrumb" style="font-size:0.82rem; color:var(--text-dim); font-family:var(--font-display);">
        <a href="/" style="color:var(--text-dim);">Home</a>
        <span style="margin:0 8px; opacity:0.4;">/</span>
        <a href="/events.html" style="color:var(--text-dim);">Events</a>
        <span style="margin:0 8px; opacity:0.4;">/</span>
        <span style="color:var(--text-soft);">Event Details</span>
      </nav>
    </div>
  </div>

  <main style="padding:var(--xl) 0 var(--3xl);">
    <div class="container">
      <div id="detail-root">
        <div style="display:grid; grid-template-columns:1.9fr 1fr; gap:var(--2xl);">
          <div>
            <div class="loading-skeleton" style="aspect-ratio:16/9; border-radius:var(--r-xl);" aria-hidden="true"></div>
            <div class="loading-skeleton" style="height:180px; margin-top:var(--xl); border-radius:var(--r-lg);" aria-hidden="true"></div>
          </div>
          <div class="loading-skeleton" style="height:420px; border-radius:var(--r-xl);" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <a href="/" class="footer-brand">Gather<em> Nepal</em></a>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="/events.html">Events</a>
        <a href="/create-event.html">Host</a>
        <a href="/login.html">Sign In</a>
        <a href="/signup.html">Sign Up</a>
      </nav>
      <p class="footer-copy">© 2026 Gather Nepal. Made by hand in Kathmandu.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/event.js"></script>
  <script src="/js/3d.js"></script>
</body>
</html>
