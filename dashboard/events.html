<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — Gather Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="layout">
    <div id="sidebar-root"></div>
    <div class="main">
      <div class="topbar">
        <h1>Events</h1>
        <div class="actions"><button class="btn btn-primary" id="add-event-btn">+ Add Event</button></div>
      </div>
      <div id="events-alert"></div>
      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Event</th><th>Category</th><th>Format</th><th>Date</th><th>Price</th><th>Sold</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead>
            <tbody id="events-tbody"><tr><td colspan="9" class="loading">Loading events...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/events-admin.js"></script>
</body>
</html>
