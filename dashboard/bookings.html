<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings — Gather Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="layout">
    <div id="sidebar-root"></div>
    <div class="main">
      <div class="topbar"><h1>Bookings</h1></div>
      <div id="bookings-alert"></div>
      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Customer</th><th>Email</th><th>Event</th><th>Tickets</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="bookings-tbody"><tr><td colspan="9" class="loading">Loading bookings...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/bookings-admin.js"></script>
</body>
</html>
